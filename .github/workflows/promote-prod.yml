name: Promote api-gateway to prod

# Same shape as bedrock-runtime-gateway-infra's promote-prod.yml: an explicit
# action against a specific already-dev-validated commit, never an
# automatic side effect of pushing to main.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: >
          Full commit SHA that already applied cleanly to dev (see a
          successful "apply (dev)" run in the CI workflow for this
          SHA). Both plan and apply below check out exactly this
          commit's environments/prod -- never "whatever main is right
          now".
        required: true
        type: string

jobs:
  plan-prod:
    name: plan (prod) @ ${{ inputs.commit_sha }}
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_API_GATEWAY_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: terraform init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: terraform plan
        working-directory: environments/prod
        run: terraform plan -input=false -lock=false

  apply-prod:
    name: apply (prod) @ ${{ inputs.commit_sha }}
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: apply-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_API_GATEWAY_APPLY_PROD_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: terraform init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: terraform apply
        working-directory: environments/prod
        run: terraform apply -input=false -auto-approve
